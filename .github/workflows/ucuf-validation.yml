name: UCUF Validation

on:
  pull_request:
    paths:
      - 'assets/resources/ui-spec/**'
      - 'assets/scripts/ui/**'
      - 'assets/scripts/battle/**'
      - 'tests/ucuf/**'
      - 'assets/scripts/core/**'
      - 'assets/scripts/shared/**'
      - 'tests/Battle*.test.ts'
      - 'tests/run-battle-skill-smoke.ts'
      - 'tests/run-ucuf-only.ts'
      - 'tools_node/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ucuf-validation.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'assets/resources/ui-spec/**'
      - 'assets/scripts/ui/**'
      - 'assets/scripts/battle/**'
      - 'tests/ucuf/**'
      - 'assets/scripts/core/**'
      - 'assets/scripts/shared/**'
      - 'tests/Battle*.test.ts'
      - 'tests/run-battle-skill-smoke.ts'
      - 'tests/run-ucuf-only.ts'
      - 'tools_node/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ucuf-validation.yml'

jobs:
  ucuf-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate UI spec
        run: npm run check:ui-spec -- --strict --check-content-contract

      - name: Runtime check all screens
        run: node tools_node/ucuf-runtime-check.js --strict --json

      - name: Run UCUF tests
        run: npm run test:ucuf

      # 戰法冒煙測試不在 run-cli 內，曾壞了很久沒人發現（PROG-2-9319），所以放進 CI
      - name: Run battle skill smoke tests
        run: npm run test:battle-skill-smoke

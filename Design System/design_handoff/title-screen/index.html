<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>3KLife · 遊戲入口</title>
<link rel="stylesheet" href="../colors_and_type.css">
<!--
  遊戲入口（標題畫面）設計稿（UI-2-0156，草稿）。取代現行 LoginScene 的灰底佔位畫面。
  視覺依 doc_spec_0031 新手開場規格書 §2.3：祖紋命篆（甲骨／金文／小篆殘筆、玉刻痕），高級、古老、神祕但不恐怖；
  不走科幻基因實驗室，也不走奇幻神魔。兩位名將立繪沿用 assets/resources/sprites/generals。
  遊戲名稱待定：body[data-title] 切換 legacy（三國傳承，規格 §2.2）／survival（三國志・生存，設計系統色票檔）。
  按 T 或右上角「名稱」切換；該切換鈕屬設計稿專用（data-draft-only），轉換時略過。
  篆字環與餘燼標 data-ucuf-skip，改由 runtime 特效處理（UI-2-0157）。
  點擊流程不變：開始遊戲 → LoadingScene → 開場（黑場古文）或大廳。
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font-body); color: #F5F1E8; }
  body { position: relative; background: #080605; }

  /* 底層：墨色與暖光 */
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 55% at 50% 42%, rgba(212,175,55,.20), transparent 70%),
      radial-gradient(ellipse 90% 70% at 50% 110%, rgba(178,34,34,.22), transparent 70%),
      linear-gradient(180deg, #17110a 0%, #0c0906 60%, #050403 100%); }
  .paper { position: absolute; inset: 0; opacity: .12; mix-blend-mode: overlay;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 1px, transparent 1px 4px); }

  /* 祖紋命篆環：緩慢旋轉的篆字圈，象徵血脈傳承 */
  .seal-ring { position: absolute; left: 50%; top: 400px; width: 900px; height: 900px; margin: -450px 0 0 -450px; opacity: .22; animation: spin 180s linear infinite; }
  .seal-ring.inner { width: 680px; height: 680px; margin: -340px 0 0 -340px; opacity: .16; animation-direction: reverse; animation-duration: 140s; }
  .seal-ring text { font-family: "Songti TC", "STSong", var(--font-headline); fill: #D4AF37; letter-spacing: 18px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 兩位名將分立左右（孫權、劉備），中央留給標題與篆字環；下緣淡出入墨 */
  .heroes { position: absolute; left: 0; right: 0; bottom: 0; height: 1080px; }
  .hero { position: absolute; bottom: -40px; filter: saturate(.85) contrast(1.05);
    -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 96%); mask-image: linear-gradient(180deg, #000 55%, transparent 96%); }
  .hero.left  { left: 150px;  width: 560px; opacity: .55; }
  .hero.right { right: 150px; width: 560px; opacity: .55; transform: scaleX(-1); }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 45%, transparent 45%, rgba(0,0,0,.78) 100%),
                linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 18%, transparent 62%, rgba(0,0,0,.9) 100%); }

  /* 餘燼 */
  .ember { position: absolute; bottom: -20px; width: 6px; height: 6px; border-radius: 50%;
    background: radial-gradient(circle, #FFE088, rgba(255,140,40,.0) 70%); animation: rise linear infinite; opacity: 0; }
  @keyframes rise { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: .9; } 100% { transform: translate(var(--dx), -900px); opacity: 0; } }

  /* 標題 */
  .title-block { position: absolute; left: 0; right: 0; top: 250px; text-align: center; }
  .title-zh { position: relative; display: inline-block; font-family: "Songti TC", "STSong", var(--font-headline); font-weight: 900; font-size: 168px; line-height: 1; letter-spacing: 24px;
    color: #FFE088; text-shadow: 0 6px 0 rgba(0,0,0,.65), 0 0 28px rgba(212,175,55,.45); }
  .stamp { position: absolute; right: -96px; top: 6px; width: 82px; height: 82px; border: 4px solid #B22222; border-radius: 6px; background: rgba(178,34,34,.92);
    color: #FFF1E0; font-family: "Songti TC", "STSong", var(--font-headline); font-size: 52px; line-height: 74px; text-align: center; letter-spacing: 0; transform: rotate(-6deg);
    box-shadow: inset 0 0 0 3px rgba(255,241,224,.35), 0 4px 12px rgba(0,0,0,.6); -webkit-text-fill-color: #FFF1E0; }
  .title-en { margin-top: 26px; font-family: var(--font-label); font-size: 22px; font-weight: 600; letter-spacing: 14px; color: #B0A880; }
  .rule { width: 520px; height: 2px; margin: 26px auto 0; background: linear-gradient(90deg, transparent, #D4AF37, transparent); }
  .tagline { margin-top: 22px; font-family: "Songti TC", "STSong", var(--font-headline); font-size: 34px; letter-spacing: 12px; color: #E9DDBF; text-shadow: 0 2px 8px rgba(0,0,0,.8); }

  body[data-title="legacy"]   .t-survival { display: none; }
  body[data-title="survival"] .t-legacy   { display: none; }
  body[data-title="survival"] .title-zh { font-size: 124px; letter-spacing: 10px; }
  body[data-title="survival"] .stamp { right: -88px; top: -4px; }

  /* 主按鈕 */
  .start { position: absolute; left: 50%; top: 742px; width: 440px; height: 92px; margin-left: -220px; border-radius: 10px; cursor: pointer;
    background: linear-gradient(180deg, #FFE088 0%, #D4AF37 55%, #9C7A1E 100%); border: 2px solid #FFF3C4;
    box-shadow: 0 0 0 4px rgba(0,0,0,.55), 0 0 0 6px #8A6E1F, 0 14px 30px rgba(0,0,0,.7), 0 0 40px rgba(255,215,0,.28);
    font-family: "Songti TC", "STSong", var(--font-headline); font-size: 42px; font-weight: 900; letter-spacing: 18px; text-indent: 18px; color: #2D1E00; line-height: 88px; text-align: center; }
  .start:hover { filter: brightness(1.08); }
  .hint { position: absolute; left: 0; right: 0; top: 860px; text-align: center; font-family: var(--font-label); font-size: 20px; letter-spacing: 6px; color: #D0C5AF; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .95; } }

  /* 左下功能鈕 */
  .side { position: absolute; left: 48px; bottom: 44px; display: flex; gap: 22px; }
  .side-btn { width: 88px; text-align: center; cursor: pointer; }
  .side-btn .ico { width: 72px; height: 72px; margin: 0 auto; border-radius: 50%; background: linear-gradient(180deg, #2a241a, #120f0a); border: 2px solid #8A6E1F;
    box-shadow: 0 6px 14px rgba(0,0,0,.6); font-family: "Songti TC", "STSong", var(--font-headline); font-size: 32px; line-height: 68px; color: #FFE088; }
  .side-btn .lbl { margin-top: 8px; font-family: var(--font-label); font-size: 17px; color: #D0C5AF; letter-spacing: 2px; }

  /* 右下版本與伺服器 */
  .meta { position: absolute; right: 48px; bottom: 50px; text-align: right; font-family: var(--font-label); font-size: 17px; color: #8C846C; line-height: 30px; }
  .meta div { color: #D0C5AF; }
  .copyright { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-family: var(--font-label); font-size: 14px; color: #5f5948; letter-spacing: 2px; }
  .rating { position: absolute; right: 48px; top: 40px; width: 64px; height: 64px; border-radius: 8px; border: 2px solid #4D6A3F; background: rgba(46,139,87,.18);
    font-family: var(--font-label); font-size: 22px; font-weight: 800; color: #86E1A5; line-height: 60px; text-align: center; }

  /* 設計稿專用：名稱切換 */
  .draft-toggle { position: absolute; right: 132px; top: 52px; padding: 8px 16px; border-radius: 20px; border: 1px dashed #8C846C; font-family: var(--font-label); font-size: 15px; color: #B0A880; cursor: pointer; background: rgba(0,0,0,.4); }
</style>
</head>
<body data-title="legacy" data-screen-label="title-screen">

  <div class="bg" id="title-screen.bg" data-layer="background"></div>
  <div class="paper" data-layer="background"></div>

  <svg class="seal-ring" id="title-screen.seal-ring" viewBox="0 0 900 900" data-layer="background" data-ucuf-skip="true">
    <defs><path id="ring-o" d="M450,450 m-400,0 a400,400 0 1,1 800,0 a400,400 0 1,1 -800,0"/></defs>
    <circle cx="450" cy="450" r="430" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="450" cy="450" r="370" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="2 10"/>
    <text font-size="40"><textPath href="#ring-o">祖紋命篆・血脈不滅・英靈長存・薪火相傳・宗嗣綿延・天命所歸・</textPath></text>
  </svg>
  <svg class="seal-ring inner" viewBox="0 0 680 680" data-layer="background" data-ucuf-skip="true">
    <defs><path id="ring-i" d="M340,340 m-290,0 a290,290 0 1,1 580,0 a290,290 0 1,1 -580,0"/></defs>
    <circle cx="340" cy="340" r="320" fill="none" stroke="#D4AF37" stroke-width="1"/>
    <text font-size="30"><textPath href="#ring-i">魏・蜀・吳・群・十四祖・六色因・命紋靈獸・</textPath></text>
  </svg>

  <div class="heroes" id="title-screen.heroes" data-layer="background">
    <img class="hero left"   src="../../../assets/resources/sprites/generals/sun_quan_portrait.png" alt="孫權">
    <img class="hero right"  src="../../../assets/resources/sprites/generals/liu_bei_portrait.png" alt="劉備">
  </div>
  <div class="vignette" data-layer="background"></div>
  <div id="embers" data-layer="fx" data-ucuf-skip="true"></div>

  <div class="title-block" id="title-screen.title">
    <div class="title-zh"><span class="t-legacy">三國傳承</span><span class="t-survival">三國志・生存</span><span class="stamp" id="title-screen.stamp"><span class="t-legacy">傳</span><span class="t-survival">生</span></span></div>
    <div class="title-en"><span class="t-legacy">THREE KINGDOMS · LEGACY</span><span class="t-survival">THREE KINGDOMS · SURVIVAL</span></div>
    <div class="rule"></div>
    <div class="tagline">血脈不滅　英靈長存</div>
  </div>

  <div class="start" id="title-screen.start" role="button">開始遊戲</div>
  <div class="hint" id="title-screen.hint">點擊任意處進入</div>

  <div class="side">
    <div class="side-btn" id="title-screen.notice"><div class="ico">告</div><div class="lbl">公告</div></div>
    <div class="side-btn" id="title-screen.settings"><div class="ico">設</div><div class="lbl">設定</div></div>
    <div class="side-btn" id="title-screen.account"><div class="ico">籍</div><div class="lbl">帳號</div></div>
  </div>

  <div class="meta" id="title-screen.meta"><div id="title-screen.version">版本 v0.1.0</div><div id="title-screen.server">伺服器 本機（單機）</div></div>
  <div class="rating" id="title-screen.rating">12+</div>
  <div class="copyright">© 3KLife　本作品為虛構創作，與史實人物無涉</div>

  <div class="draft-toggle" data-draft-only="true" data-ucuf-skip="true" onclick="toggleTitle()">名稱：切換（T）</div>

<script>
  function toggleTitle() {
    document.body.dataset.title = document.body.dataset.title === 'legacy' ? 'survival' : 'legacy';
  }
  document.addEventListener('keydown', (e) => { if (e.key === 't' || e.key === 'T') toggleTitle(); });
  const q = new URLSearchParams(location.search).get('title');
  if (q === 'survival' || q === 'legacy') document.body.dataset.title = q;
  const box = document.getElementById('embers');
  for (let i = 0; i < 26; i++) {
    const e = document.createElement('div');
    e.className = 'ember';
    e.style.left = (8 + Math.random() * 84) + '%';
    e.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    e.style.animationDuration = (9 + Math.random() * 9) + 's';
    e.style.animationDelay = (-Math.random() * 18) + 's';
    box.appendChild(e);
  }
</script>
</body>
</html>

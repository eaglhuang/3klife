<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>3KLife · 轉蛋</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; }
html, body {
  width: 1920px; height: 1080px; overflow: hidden;
  font-family: var(--font-body); color: var(--text-primary);
}

/* ══ Pool data (drives everything) ══════════════════════════ */
/* Handled by JS: pools[] array */

/* ══ Layout ══════════════════════════════════════════════════ */

/* Full-bleed banner (left ~60%) */
.banner-stage {
  position: absolute; top: 0; left: 0; right: 460px; bottom: 200px;
  overflow: hidden;
}
.banner-slide {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity 380ms var(--ease-default);
  pointer-events: none;
}
.banner-slide.active { opacity: 1; pointer-events: auto; }

.banner-bg-fill { position: absolute; inset: 0; }
.banner-art-area {
  position: absolute; inset: 0;
  display: flex; align-items: flex-end; justify-content: center;
}
.banner-art-placeholder {
  width: 480px; height: 85%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-label); font-size: 12px; letter-spacing: .12em;
  border-radius: 20px 20px 0 0;
}
.banner-title-block {
  position: absolute; bottom: 44px; left: 52px; z-index: 5;
}
.banner-event-chip {
  display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px;
  font-family: var(--font-label); font-size: 10px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase;
  padding: 4px 12px; border-radius: 4px;
}
.banner-hero-name {
  font-family: var(--font-headline); font-size: 72px; font-weight: 900;
  letter-spacing: .08em; line-height: 1;
  text-shadow: 0 0 40px var(--pool-glow, rgba(255,224,136,.5)), 0 4px 8px rgba(0,0,0,.9);
}
.banner-hero-title {
  font-family: var(--font-label); font-size: 14px; letter-spacing: .4em;
  margin-top: 10px; color: #A4D2D0;
}
.banner-guarantee-chip {
  display: inline-flex; align-items: center; gap: 10px; margin-top: 16px;
  border-radius: 8px; padding: 8px 18px;
  font-family: var(--font-label); font-size: 11px; letter-spacing: .1em;
}

/* Fade edges on banner */
.banner-fade-right {
  position: absolute; top: 0; right: 0; width: 180px; bottom: 0;
  background: linear-gradient(90deg, transparent, var(--pool-bg-edge, #0a0612));
  pointer-events: none; z-index: 4;
}
.banner-fade-bottom {
  position: absolute; bottom: 0; left: 0; right: 0; height: 120px;
  background: linear-gradient(0deg, var(--pool-bg-bottom, #0a0612), transparent);
  pointer-events: none; z-index: 4;
}

/* Pool brief chip (spec-driven) */
.pool-brief {
  position: absolute; top: 16px; left: 20px; z-index: 20;
  background: rgba(0,0,0,.75); border-radius: 8px; padding: 10px 16px;
  backdrop-filter: blur(10px); max-width: 280px;
  border: 1px solid rgba(255,255,255,.08);
  transition: opacity 300ms;
}
.brief-tag  { font-family: var(--font-label); font-size: 8px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 4px; }
.brief-line { font-family: var(--font-label); font-size: 11px; color: #D0C5AF; line-height: 1.55; letter-spacing: .04em; }
.brief-line strong { color: #CE93D8; }

/* ── NAV ARROWS (on banner sides) ─────────────────────────── */
.nav-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 64px; height: 64px; border-radius: 50%; z-index: 30; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 900;
  background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.12);
  backdrop-filter: blur(8px);
  transition: all 160ms var(--ease-default);
  color: #D0C5AF; user-select: none;
}
.nav-arrow:hover { background: rgba(212,175,55,.2); border-color: #D4AF37; color: #FFE088; transform: translateY(-50%) scale(1.06); }
.nav-arrow.prev { left: 20px; }
.nav-arrow.next { right: 20px; }

/* Pool indicator dots */
.pool-dots {
  position: absolute; bottom: 220px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; z-index: 30;
}
.pool-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,.2); border: 1.5px solid rgba(255,255,255,.3);
  cursor: pointer; transition: all 200ms;
}
.pool-dot.active { background: #D4AF37; border-color: #D4AF37; width: 24px; border-radius: 4px; }

/* Pool name tab strip at top of banner */
.pool-name-strip {
  position: absolute; top: 0; left: 0; right: 460px;
  height: 56px; z-index: 25;
  background: linear-gradient(180deg, rgba(0,0,0,.8), rgba(0,0,0,0));
  display: flex; align-items: center; padding: 0 120px;
  pointer-events: none;
}
.pool-name-label {
  font-family: var(--font-label); font-size: 10px; font-weight: 700;
  letter-spacing: .22em; text-transform: uppercase; opacity: .6;
}
.pool-name-val {
  font-family: var(--font-headline); font-size: 16px; font-weight: 700;
  color: #FFE088; letter-spacing: .14em; margin-left: 14px;
}

/* ── RIGHT PANEL ──────────────────────────────────────────── */
.right-panel {
  position: absolute; top: 0; right: 0; width: 460px; bottom: 200px;
  background: linear-gradient(180deg, #0e0a16 0%, #0a0810 100%);
  border-left: 1px solid rgba(255,255,255,.06);
  display: flex; flex-direction: column; padding: 28px 26px; gap: 0;
  overflow: hidden;
}

/* Right panel has animated transition */
.rp-content { flex: 1; display: flex; flex-direction: column; gap: 20px; }
.rp-slide { transition: opacity 300ms, transform 300ms var(--ease-default); }
.rp-slide.out { opacity: 0; transform: translateX(16px); }

/* Pool header in right panel */
.rp-pool-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.rp-pool-name { font-family: var(--font-headline); font-size: 22px; font-weight: 700; color: #FFE088; letter-spacing: .08em; line-height: 1.2; }
.rp-pool-sub  { font-family: var(--font-label); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; margin-top: 5px; }
.rp-pool-badge {
  padding: 4px 12px; border-radius: 20px;
  font-family: var(--font-label); font-size: 9px; font-weight: 800; letter-spacing: .12em;
  flex-shrink: 0;
}

/* Pity bar */
.pity-block { }
.pity-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.pity-title { font-family: var(--font-label); font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
.pity-link  { font-family: var(--font-label); font-size: 10px; color: #4D4635; letter-spacing: .06em; cursor: pointer; text-decoration: underline; }
.pity-track {
  height: 30px; border-radius: 6px; background: rgba(0,0,0,.5);
  border: 1px solid rgba(255,255,255,.08); overflow: hidden; position: relative;
}
.pity-fill  { height: 100%; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; transition: width 500ms var(--ease-default); }
.pity-fill-label { font-family: var(--font-num); font-size: 13px; font-weight: 700; color: #fff; }
.pity-scale {
  display: flex; justify-content: space-between;
  font-family: var(--font-label); font-size: 9px; color: #3a3030; letter-spacing: .06em; margin-top: 4px;
}

/* Rate table */
.rate-block { }
.block-label { font-family: var(--font-label); font-size: 9px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #4D4635; margin-bottom: 10px; }
.rate-list { display: flex; flex-direction: column; gap: 5px; }
.rate-item {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px;
  background: rgba(255,255,255,.025); border-radius: 6px; border-left: 3px solid;
}
.rate-rarity { font-family: var(--font-label); font-size: 10px; font-weight: 800; letter-spacing: .1em; min-width: 36px; }
.rate-track  { flex: 1; height: 5px; background: rgba(0,0,0,.5); border-radius: 3px; overflow: hidden; }
.rate-bar    { height: 100%; border-radius: 3px; transition: width 500ms var(--ease-default); }
.rate-pct    { font-family: var(--font-num); font-size: 12px; font-weight: 700; min-width: 42px; text-align: right; }

/* Cost card */
.cost-card {
  border-radius: 10px; padding: 12px 16px;
  display: flex; justify-content: space-around; align-items: center;
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07);
}
.cost-item { text-align: center; }
.cost-label { font-family: var(--font-label); font-size: 9px; color: #4D4635; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 4px; }
.cost-val   { font-family: var(--font-num); font-size: 18px; font-weight: 700; }
.cost-sep   { width: 1px; height: 36px; background: rgba(255,255,255,.08); }

.rules-note {
  font-family: var(--font-label); font-size: 9px; color: #2a2a3a; letter-spacing: .08em; line-height: 1.7;
}

/* ── HISTORY MODAL ──────────────────────────────────────── */
.history-modal {
  position: fixed; inset: 0; z-index: 999;
  background: rgba(0,0,0,.85); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 280ms;
}
.history-modal.open { display: flex; opacity: 1; }
.history-modal.closing { opacity: 0; }

.history-panel {
  width: 85%; max-width: 1200px; height: 85%;
  background: linear-gradient(180deg, #1a1520 0%, #0f0c14 100%);
  border: 1.5px solid rgba(212,175,55,.4);
  border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.9);
  display: flex; flex-direction: column;
  overflow: hidden;
}

.history-header {
  padding: 24px 32px; border-bottom: 1px solid rgba(212,175,55,.2);
  display: flex; align-items: center; justify-content: space-between;
}
.history-title {
  font-family: var(--font-headline); font-size: 28px; font-weight: 800;
  color: #FFE088; letter-spacing: .15em;
}
.history-close {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,.06); border: 1.5px solid #4D4635;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #B0A880; transition: all 140ms;
}
.history-close:hover { background: rgba(212,175,55,.2); border-color: #D4AF37; color: #FFE088; }

.history-content {
  flex: 1; overflow-y: auto; padding: 20px 32px;
  display: flex; flex-direction: column; gap: 0;
  scrollbar-width: thin; scrollbar-color: #4D4635 transparent;
}
.history-content::-webkit-scrollbar { width: 6px; }
.history-content::-webkit-scrollbar-thumb { background: #4D4635; border-radius: 3px; }
.history-content::-webkit-scrollbar-track { background: transparent; }

.history-row {
  display: grid; grid-template-columns: 60px 1fr 80px 100px 80px 120px;
  gap: 16px; align-items: center;
  padding: 12px 16px; border-radius: 8px;
  border-bottom: 1px solid rgba(255,255,255,.05);
  transition: background 140ms;
}
.history-row:hover { background: rgba(212,175,55,.08); }

.history-row-num {
  font-family: var(--font-num); font-size: 13px; font-weight: 700;
  color: #6B5E4E; text-align: center;
}

.history-row-card {
  display: flex; align-items: center; gap: 10px;
}
.history-row-card-img {
  width: 48px; height: 48px; border-radius: 6px;
  background: rgba(255,255,255,.04); border: 1px solid rgba(212,175,55,.2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-headline); font-size: 18px; font-weight: 800;
}
.history-row-card-info { flex: 1; min-width: 0; }
.history-row-card-name {
  font-family: var(--font-headline); font-size: 14px; font-weight: 700;
  color: #FFE088; letter-spacing: .08em; white-space: nowrap;
}
.history-row-card-rarity {
  font-family: var(--font-label); font-size: 9px; color: #6B5E4E;
  letter-spacing: .08em; margin-top: 2px;
}

.history-row-pull {
  font-family: var(--font-num); font-size: 12px; font-weight: 700;
  color: #B0A880; text-align: center;
}

.history-row-rarity-badge {
  padding: 4px 10px; border-radius: 6px;
  font-family: var(--font-label); font-size: 10px; font-weight: 800;
  letter-spacing: .08em; text-align: center;
}
.rarity-ssr { background: #FFD700; color: #2D1E00; }
.rarity-sr  { background: #86E1A5; color: #1a1a1a; }
.rarity-r   { background: #6B5E4E; color: #E8E4DC; }

.history-row-time {
  font-family: var(--font-label); font-size: 10px; color: #4D4635;
  letter-spacing: .06em; text-align: right; white-space: nowrap;
}

/* ── PULL BAR (bottom) ───────────────────────────────────── */
.pull-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
  background: linear-gradient(0deg, rgba(0,0,0,.97) 60%, rgba(0,0,0,.8) 100%);
  display: flex; align-items: center; justify-content: center; gap: 20px;
  padding: 0 60px; z-index: 20;
  border-top: 1px solid rgba(255,255,255,.06);
}
.btn-history {
  height: 56px; padding: 0 24px; cursor: pointer;
  background: rgba(255,255,255,.04); border: 1.5px solid #2a2a3a;
  border-radius: 10px; color: #6B5E4E;
  font-family: var(--font-label); font-size: 13px; font-weight: 700; letter-spacing: .1em;
  display: flex; align-items: center; gap: 10px;
  transition: all 140ms;
}
.btn-history:hover { border-color: #4D4635; color: #D0C5AF; }

.pull-btn {
  height: 88px; border-radius: 14px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  font-family: var(--font-label); font-weight: 800; letter-spacing: .1em;
  transition: all 150ms var(--ease-default);
}
.pull-single {
  min-width: 220px;
  background: linear-gradient(180deg, #20201f, #111);
  border: 2px solid #3a3328; color: #D0C5AF;
  box-shadow: 0 4px 14px rgba(0,0,0,.5);
}
.pull-single:hover { border-color: #D4AF37; color: #FFE088; }
.pull-ten {
  min-width: 290px;
  background: linear-gradient(180deg, #FFE088 0%, #D4AF37 55%, #8A6E1F 100%);
  border: 2px solid #3a2b08; color: #2D1E00;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 4px 0 #3a2b08, 0 9px 22px rgba(0,0,0,.65);
}
.pull-ten:hover { filter: brightness(1.07); }
.pull-label { font-size: 20px; }
.pull-sub   { font-size: 11px; opacity: .75; }
.pull-cost-chip {
  display: flex; align-items: center; gap: 5px; margin-top: 2px;
  background: rgba(0,0,0,.25); border-radius: 20px; padding: 3px 12px;
}
.pc-ico { width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; font-size: 7px; font-weight: 800; }
.pc-num { font-size: 13px; font-weight: 800; }

.btn-alt-group { display: flex; flex-direction: column; gap: 8px; }
.btn-alt {
  height: 44px; padding: 0 20px; cursor: pointer;
  background: rgba(255,255,255,.04); border: 1.5px solid #2a2a3a;
  border-radius: 8px; color: #6B5E4E;
  font-family: var(--font-label); font-size: 11px; font-weight: 700; letter-spacing: .08em;
  display: flex; align-items: center; gap: 8px;
  transition: all 140ms;
}
.btn-alt:hover { border-color: #4D4635; color: #D0C5AF; }

/* Pull bar left label */
.pull-bar-pool {
  position: absolute; left: 60px; top: 50%; transform: translateY(-50%);
  text-align: left;
}
.pull-bar-pool-label { font-family: var(--font-label); font-size: 9px; color: #3a3030; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 3px; }
.pull-bar-pool-name  { font-family: var(--font-headline); font-size: 18px; font-weight: 700; color: #FFE088; letter-spacing: .08em; }
</style>
</head>

</div>

function renderBrief(p) {

/* ── Navigate ── */
function navigate(dir) {
  goTo((cur + dir + POOLS.length) % POOLS.length);
}
function goTo(idx) {
  if (idx === cur || animating) return;
  animating = true;
  const slides = document.querySelectorAll('.banner-slide');
  const dots   = document.querySelectorAll('.pool-dot');
  const rp = document.getElementById('rp-content');

  // Fade out
  slides[cur].classList.remove('active');
  dots[cur].classList.remove('active');
  rp.style.opacity = '0';
  rp.style.transform = 'translateX(14px)';
  rp.style.transition = 'opacity 220ms, transform 220ms';

  cur = idx;
  localStorage.setItem('3klife-gacha-pool', cur);

  setTimeout(() => {
    slides[cur].classList.add('active');
    dots[cur].classList.add('active');
    document.getElementById('strip-name').textContent = POOLS[cur].name;
    document.getElementById('pullbar-name').textContent = POOLS[cur].name;
    renderBrief(POOLS[cur]);
    renderRight(POOLS[cur]);
    requestAnimationFrame(() => {
      rp.style.transform = 'translateX(0)';
      rp.style.opacity = '1';
    });
    setTimeout(() => { animating = false; }, 280);
  }, 250);
}

/* ── Util ── */
function hexToRgb(hex) {
  const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r ? `${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}` : '255,255,255';
}

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Interaction Carousel</title>
</head>
<body>
  <button id="pool-prev" data-ucuf-action="tabSwitch" data-target="general">Prev</button>
  <button id="pool-next" data-ucuf-action="tabSwitch" data-target="legendary">Next</button>
  <section id="pool-host" data-ucuf-tab-content="general" role="tabpanel">General pool</section>
  <section data-ucuf-tab-content="legendary" role="tabpanel" hidden>Legendary pool</section>
</body>
</html>

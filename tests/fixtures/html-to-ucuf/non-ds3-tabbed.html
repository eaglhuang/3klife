<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Non DS3 Tabbed Fixture</title>
</head>
<body>
  <nav role="tablist">
    <button role="tab" data-tab="overview" aria-controls="overview-panel">Overview</button>
    <button role="tab" data-tab="inventory" aria-controls="inventory-panel">Inventory</button>
  </nav>
  <section id="overview-panel" role="tabpanel" data-ucuf-tab-content="overview">Overview content</section>
  <section id="inventory-panel" role="tabpanel" data-ucuf-tab-content="inventory" hidden>Inventory content</section>
</body>
</html>
